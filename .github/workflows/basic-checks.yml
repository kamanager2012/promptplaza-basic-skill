name: Basic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify repository, run bounded offline tests and clean installation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/check-repository.py --package .runtime/release
      - name: Retain the tested nine-file ZIP, checksum and build receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basic-release-${{ github.sha }}
          path: |
            .runtime/release/promptplaza-basic-*.zip
            .runtime/release/SHA256SUMS
            .runtime/release/build.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
