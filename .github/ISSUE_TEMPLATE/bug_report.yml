name: 安装或使用问题
description: 提交可复现的免费 Basic 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请使用合成内容，不要提交 token、密码、验证码、个人会话或第三方提示词正文。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: Skill 版本与安装方式
      description: 例如 beta.7，固定 tag 克隆或发行 ZIP
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统、Agent 宿主与 Node 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最少复现步骤
      description: 使用自己编写的合成需求或文本，注明当前工作目录与安装目录的关系，路径可脱敏。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果
      description: 附脱敏错误码即可；请勿粘贴原始会话或完整远端响应。
    validations:
      required: true
